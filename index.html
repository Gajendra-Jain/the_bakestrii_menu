<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the_bakestrii | Our Sweet Catalogue</title>
<meta name="description" content="the_bakestrii menu: cookies, nankhatai, millet cookies, Jain Sattvik cookies, cakes, cupcakes and brownies.">
<meta name="theme-color" content="#fdf0e6">
<meta property="og:title" content="the_bakestrii | Our Sweet Catalogue">
<meta property="og:description" content="Cookies, nankhatai, cakes, cupcakes and brownies. Tap to see the menu.">
<meta property="og:image" content="icon.png">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{--cream:#fdf0e6;--brown:#60281a;--pink:#f8c4c4;--pink-deep:#e8607a;--line:#e9b9a0}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--cream);color:var(--brown);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:600px;margin:0 auto;padding:0 12px 40px}
  header{text-align:center;padding:22px 0 6px}
  header img{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto}
  h1{font-size:1.5rem;margin:12px 0 2px;font-style:italic;font-weight:700}
  .tag{margin:0;font-size:.95rem;opacity:.8}
  nav{position:sticky;top:0;z-index:5;background:var(--cream);display:flex;gap:8px;overflow-x:auto;padding:10px 2px;margin:8px -12px 6px;padding-left:12px;padding-right:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;text-decoration:none;color:var(--brown);background:var(--pink);padding:8px 14px;border-radius:999px;font-size:.9rem;font-weight:700;white-space:nowrap}
  section{scroll-margin-top:62px;margin:14px 0}
  section img{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 2px 10px rgba(96,40,26,.12);background:#fbe6d8}
  .order{text-align:center;margin-top:26px;padding:22px 14px;border:2px solid var(--line);border-radius:18px;background:#fff8f2}
  .order h2{margin:0 0 4px;font-style:italic;font-size:1.3rem}
  .order p{margin:0 0 14px;font-size:.95rem}
  .btn{display:block;margin:10px auto 0;max-width:340px;padding:13px 16px;border-radius:999px;text-decoration:none;font-weight:700;font-size:1rem;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wa{background:#1fa855;color:#fff}
  .ig{background:var(--brown);color:#fff}
  footer{text-align:center;font-size:.8rem;opacity:.65;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.webp" width="480" height="480" alt="the_bakestrii logo">
    <h1>Our Sweet Catalogue</h1>
  </header>

  <nav aria-label="Menu sections">
    <a href="#cookies">Cookies</a>
    <a href="#millet">Millet &amp; Tea-Time</a>
    <a href="#jain">Jain Sattvik</a>
    <a href="#cakes">Frosted Cakes</a>
    <a href="#treats">Bento, Cupcakes &amp; Brownies</a>
    <a href="#order">Order</a>
  </nav>

  <section id="cookies"><img src="menu-1.webp" width="1000" height="1500" alt="Cookies and Nankhatai price list, 200 g and 500 g packs" fetchpriority="high"></section>
  <section id="millet"><img src="menu-2.webp" width="1000" height="1333" alt="Millet cookies and tea-time cakes price list" loading="lazy"></section>
  <section id="jain"><img src="menu-3.webp" width="1000" height="1500" alt="Jain Sattvik cookies price list, 200 g and half kg packs" loading="lazy"></section>
  <section id="cakes"><img src="menu-4.webp" width="1000" height="1333" alt="Frosted cakes price list, 1 pound and 2 pounds" loading="lazy"></section>
  <section id="treats"><img src="menu-5.webp" width="1000" height="1500" alt="Bento cakes, cupcakes and brownies price list" loading="lazy"></section>

  <div class="order" id="order">
    <h2>Place your order</h2>
    <p>Message us on WhatsApp or find us on Instagram.</p>
    <a class="btn wa" href="https://wa.me/919309249569">WhatsApp 93092 49569</a>
    <a class="btn wa" href="https://wa.me/919024186663">WhatsApp 90241 86663</a>
    <a class="btn ig" href="https://www.instagram.com/the_bakestrii/">Instagram @the_bakestrii</a>
  </div>
  <footer>the_bakestrii</footer>
</div>
</body>
</html>
